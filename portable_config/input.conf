# Check the following link for mpv's default keybindings:
# https://github.com/mpv-player/mpv/blob/master/etc/input.conf

# ==========    CUSTOM KEYBINDINGS    ==========

# GENERAL
k           cycle ontop
Ctrl+o          script-binding open_file_echostorm/open           # open file(s) via Windows file dialog
Ctrl+Shift+o    script-binding open_file_echostorm/open_folder     # open folder via Windows folder dialog
Ctrl+u          script-binding open_file_echostorm/open_url        # open URL via Windows input box dialog
Ctrl+y          script-binding browse/youtube-search               # search YouTube in the mpv console
Ctrl+t          script-binding browse/twitch-search                # search Twitch live channels in the mpv console
Ctrl+n          script-binding browse/torrent-search               # search the torrent index set in browse.conf
Ctrl+b          script-binding browse/reopen                       # reopen the last browse results without refetching
Ctrl+Shift+t    script-binding webtorrent/toggle-info             # torrent transfer overlay while a release streams (hook default "p" is taken by sub-fix-timing below)
Ctrl+Shift+s    script-binding open_file_echostorm/add_subtitle    # add subtitle via Windows file dialog
Ctrl+Shift+a    script-binding open_file_echostorm/add_audio       # add audio track via Windows file dialog

# WHICH-KEY (whichkey.lua): a prefix key shows its "<prefix>-<key>" bindings,
# labelled by the comment after "#"; the next key runs one, Esc closes.
g           script-binding whichkey/show g              # lists (select.lua); sub-reload moved from g to g-g
g-a         script-binding select/select-aid            # audio tracks
g-b         script-binding select/select-binding        # all key bindings (searchable)
g-c         script-binding select/select-chapter        # chapters
g-d         script-binding select/select-audio-device   # audio devices
g-e         script-binding select/select-edition        # editions
g-g         sub-reload                                  # reload subtitles
g-h         script-binding select/select-watch-history  # watch history
g-l         script-binding select/select-subtitle-line  # subtitle lines
g-L         script-binding select/select-secondary-subtitle-line # secondary subtitle lines
g-m         script-binding select/menu                  # menu
g-p         script-binding select/select-playlist       # playlist
g-r         script-binding select/show-properties       # properties
g-s         script-binding select/select-sid            # subtitle tracks
g-S         script-binding select/select-secondary-sid  # secondary subtitle tracks
g-t         script-binding select/select-track          # all tracks
g-v         script-binding select/select-vid            # video tracks
g-w         script-binding select/select-watch-later    # watch later
b           script-binding whichkey/show b              # browse (replaces mpv's default b = deband; deband is on d)
b-y         script-binding browse/youtube-search        # YouTube search
b-s         script-binding browse/youtube-subscriptions # YouTube subscriptions
b-h         script-binding browse/youtube-home          # YouTube home
b-H         script-binding browse/youtube-history       # YouTube history
b-w         script-binding browse/youtube-watch-later   # YouTube watch later
b-t         script-binding browse/twitch-search         # Twitch search
b-l         script-binding browse/twitch-live           # Twitch live channels
b-n         script-binding browse/torrent-search        # Torrent search
b-N         script-binding browse/torrent-new           # Torrent new releases
b-f         script-binding browse/torrent-followed      # Torrent followed shows
b-r         script-binding browse/reopen                # Reopen last results

# VIDEO
d           cycle deband
D           cycle deinterlace
n           cycle video-unscaled
C           cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1" # cycle the video aspect ratio ("-1" is the container aspect)
c           script-binding vsr_autocrop/toggle_crop     # manual crop+VSR toggle/undo (script's own default "C" is taken above by the aspect-ratio cycle, remapped to lowercase)

# AUDIO
a           cycle audio
A           cycle audio down
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
UP          add volume 2
DOWN        add volume -2
x           add audio-delay -0.05
X           add audio-delay +0.05

# SUBTITLES
Shift+g     add sub-scale +0.05                     # increase the subtitle font size
Shift+f     add sub-scale -0.05                     # decrease the subtitle font size
E           add sub-gauss +0.1
R           add sub-gauss -0.1
z           add sub-delay -0.05                     # shift subtitles 50 ms earlier
Z           add sub-delay +0.05                     # shift subtitles 50 ms later
u           cycle sub-gray
U           cycle blend-subtitles
p           cycle sub-fix-timing
l           cycle-values sub-ass-override "yes" "force" "no"
