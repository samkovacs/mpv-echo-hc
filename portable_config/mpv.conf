# mpv only ever reads mpv.conf. profiles.conf is NOT auto-loaded by
# filename -- without this include every profile in it (HDR,
# 4k-Downscaling, the Downmix-Audio pair, every shader profile) is
# silently inert. Verified: with this line absent, target-trc/
# target-peak/glsl-shaders all stay at 'auto'/empty on a PQ 2160p file.
include=~~/profiles.conf

load-select=yes

profile=high-quality
vo=gpu-next
priority=high
gpu-api=d3d11
vd-lavc-dr=yes
gpu-context=auto
fullscreen=no
taskbar-progress=yes
force-seekable=yes
keep-open=always
reset-on-next-file=pause
# Auto-writes watch-later position data on every quit, for every file --
# resume-playback (mpv's own default, on) then auto-resumes from it next
# time. Without this, nothing was ever being written to resume FROM.
save-position-on-quit=yes
# mpv's default watch-later-options persists vf, video-crop and sub-pos.
# All three are actively harmful here:
#   vf / video-crop -- vsr_autocrop.lua computes both per playback from
#     the current display geometry and detected letterbox. A resume that
#     restores a stale @vsr chain or a crop rectangle computed for a
#     different scale factor mis-crops the picture. Real example found in
#     watch_later: "video-crop=3584x2160+128+0".
#   sub-pos -- conflicts with modernz's sub_margins handling; the OSC
#     itself logs "sub_margins conflict" on every startup without this.
# Position, volume and track selection are still saved.
#
# ONE ITEM PER LINE. --watch-later-options-remove deletes a single list
# entry and does not split its argument on commas, so the comma-separated
# form this used to have was a silent no-op: mpv looked for an option
# literally named "vf,video-crop,sub-pos", found none, and left all three
# in place. Verified by reading options/watch-later-options at runtime --
# with the one-line form it still contained vf, video-crop and sub-pos.
# That is how "video-crop=3584x2160+128+0" got into watch_later, and why
# ModernZ still logged "sub_margins conflict" on every startup despite the
# option apparently being set.
watch-later-options-remove=vf
watch-later-options-remove=video-crop
watch-later-options-remove=sub-pos
# -copy (not plain d3d11va): keeps every decoded frame readable in system
# RAM, which vsr_autocrop.lua's cropdetect needs. @vsr (d3d11vpp) still
# works fine on a copied-back frame -- it re-uploads to hardware itself.
hwdec-codecs=all
hwdec=d3d11va-copy
d3d11-exclusive-fs=yes
dither-depth=auto
scale-antiring=0.6

# Network / Cache (HLS and live stream stability)
cache=yes
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=512MiB
demuxer-readahead-secs=20
stream-buffer-size=4MiB
# audio-stream-silence: disabled by default -- mpv's own manual calls
# it "strongly discouraged" (changes A/V-sync and underrun handling
# globally, for every file, not just HLS). Originally here to prevent
# silent audio on playlist-next for demuxed HLS streams, but that hasn't
# been an actual problem in practice.
#
# UNCOMMENT THIS if: your audio cuts out, drops, or goes silent for a
# moment right after seeking, unpausing, or skipping to the next track/
# file. This is a known issue with older or budget HDMI A/V receivers
# (AVRs) / soundbars that ignore or drop the first bit of audio every
# time HDMI audio output stops and restarts.
#audio-stream-silence=yes

# Audio Output
ao=wasapi

# Scalers and Shaders
scale=ewa_lanczossharp
dscale=hermite
cscale=ewa_lanczossharp
cscale-antiring=0.6          # matched to scale-antiring
gpu-shader-cache-dir=~~/shaders/cache

# Video Sync
# display-resample resamples audio to match display refresh for smoother motion.
# Note: disable or set to 'audio' for live/HLS streams — it can cause issues there.
video-sync=display-resample

# Motion interpolation (off by default, toggle from the right-click &Video
# menu). tscale=oversample is a safe, low-overhead default for when it's
# switched on -- it's the same value mpv falls back to automatically, set
# explicitly here so it's easy to find and tune if a smoother-but-costlier
# scaler is wanted instead (e.g. mitchell/catmull_rom).
interpolation=no
tscale=oversample

# Debanding
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32

temporal-dither

# OSD and Controller
osd-bar=no
osc=no
border=yes
cursor-autohide-fs-only=yes
cursor-autohide=300
osd-level=1
osd-duration=1000
hr-seek=yes
osd-font=Netflix Sans Medium
osd-font-size=37
# Quoted: # starts a comment in mpv.conf, so an unquoted #RRGGBB value here
# silently becomes an empty string (mpv logs "option requires parameter").
osd-color="#FFFFFF"
osd-border-color="#000000"
osd-border-size=0.6
osd-blur=0.2

# Language Priority
# und = untagged tracks (common on HLS), auto = respect DEFAULT= if nothing matches
alang=eng,en,und,auto
slang=eng,en

# Audio
volume=100
audio-file-auto=fuzzy
volume-max=200
audio-pitch-correction=yes

# Audio Normalization
# dynaudnorm is a single-pass, live-stream-safe volume leveler.
# Uncomment when you need it (e.g. loud/quiet live streams, Fishtank, etc.)
# Unlike loudnorm it won't buffer the entire file before starting.
#af=lavfi=[dynaudnorm=f=150:g=15:p=0.95]

# Subtitles
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no
sub-auto=all
sub-font=Netflix Sans Medium
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2.0
sub-shadow-offset=0
sub-spacing=0.0

# Screenshots
# screenshotfolder_echostorm.lua overrides directory and template at runtime.
# screenshot-high-bit-depth has no effect here because the script forces jpg output.
screenshot-format=png
screenshot-png-compression=1
screenshot-directory=~~desktop/mpv/screenshots
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"

# Auto Profiles
[WEB-DL]
profile-desc=WEB-DL Anime (HatSubs, SubsPlease, HorribleSubs, Erai-raws)
# p.filename is nil whenever this condition gets evaluated with nothing
# loaded (e.g. idle at startup) -- string.match(nil, ...) throws
# "bad argument #1 to 'match' (string expected, got nil)" on every such
# evaluation without this guard (confirmed in mpv.log). Short-circuits
# before ever calling string.match if there's no filename yet.
profile-cond=p.filename ~= nil and (string.match(p.filename, "HatSubs")~=nil or string.match(p.filename, "SubsPlease")~=nil or string.match(p.filename, "HorribleSubs")~=nil or string.match(p.filename, "Erai%-raws")~=nil)
deband=yes
# Live/HLS profiles should override video-sync back to audio if added in future
