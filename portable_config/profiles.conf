glsl-shaders="~~/shaders/krigbl.glsl;~~/shaders/A4K_Restore_CNN_Soft_M.glsl;~~/shaders/A4K_Clamp_Highlights.glsl"

### Conditional Profiles ###

[HDR]
profile-desc=HDR
# NOTE: keyed on video-params (the DECODED source), which is stable.
# Do NOT re-key this on video-out-params to catch RTX Video HDR output:
# tested, and it oscillates. This profile used to set d3d11-output-format,
# which forces a VO reconfig, which momentarily nulls
# video-out-params, which un-fires the condition, which restores, which
# reconfigs again -- observed flapping pq/nil every ~1.5s in playback.
# RTX-HDR-converted SDR is handled elsewhere: vsr_autocrop.lua applies
# this profile explicitly (it knows deterministically when it turned
# true-HDR on), and hdr-mode.lua picks up the converted signal on its own,
# since video-out-params then reports max-luma=1000, above its >203 test.
#
# OWNERSHIP: target-peak, target-contrast, target-prim, target-trc and
# target-colorspace-hint are NOT set here. hdr-mode.lua owns them.
#
# They used to be set in both places. hdr-mode.lua's on_start() observes
# all five and its check_paramet() writes them back to its own values
# whenever they change, so this profile would set target-peak=603, get
# observed, and be immediately reverted to whatever the display plugin
# reported -- the hand-measured value here never reached the renderer.
# Two writers, no defined precedence, and a third (vsr_autocrop.lua's
# apply_hdr_profile/restore_hdr_profile) on top of them.
#
# The measured OLED values are not lost: the plugin reports this panel's
# real peak, and a black level of 0.0000 makes hdr-mode.lua's "auto"
# contrast resolve to "inf" -- the same numbers, now derived per display
# instead of hardcoded, so the 2560x1440 and 1920x1080 panels get theirs.
#
# What remains below is only what hdr-mode.lua does NOT touch: dither
# depth, output levels, subtitle peak handling, and peak detection.
#
# SWAPCHAIN: d3d11-output-csp/-format are deliberately NOT set (auto).
# They are read only at VO creation, so changing them here rebuilt the whole
# VO and restarted the decoder mid-GOP ~0.2 s into every HDR file: 32 HEVC
# "Could not find ref" errors, a restart from 0 and [HDR] applied twice
# (hwdec=no too, so not a hwdec quirk). With auto, libplacebo follows
# target-colorspace-hint (hdr-mode.lua sets it): measured with Windows HDR
# on, the swapchain comes up R10G10B10A2 + RGB_FULL_G2084_NONE_P2020 with
# one VO init for a whole SDR/HDR playlist. With Windows HDR off it stays
# sRGB, where the forced pq used to send PQ to an SDR desktop anyway.
# (Never force rgba16f: PQ is not a valid DXGI colour space on fp16.)
profile-cond=(p["video-params/primaries"] == "bt.2020") and (p["video-params/gamma"] == "pq")
# No profile-restore: applying this reinits the decoder, video-params go nil
# for a moment, and a restore then rebuilds the whole VO before re-applying
# (measured: two extra swapchain rebuilds at every HDR start). [SDR] below
# undoes it instead, keyed on video-params being PRESENT and not PQ.
dither-depth=10
sub-hdr-peak=203       # SDR reference white; 1000-nit subs on OLED are painful
# Separate option, separate default (1000). Governs PGS/VOBSUB bitmap subs,
# which is what Blu-ray remuxes actually carry -- sub-hdr-peak does NOT
# cover them. Left at 1000 it renders burned-in subs at ~1.7x this panel's
# full peak. "sdr" matches the text-sub setting above.
image-subs-hdr-peak=sdr
hdr-compute-peak=yes
video-output-levels=full

# Undoes [HDR] on the next non-HDR file. Before this, every SDR file after
# an HDR one kept dither-depth=10 and full output levels.
# Same list and values as vsr_autocrop.lua's restore_hdr_profile().
[SDR]
profile-cond=p["video-params/gamma"] ~= nil and not ((p["video-params/primaries"] == "bt.2020") and (p["video-params/gamma"] == "pq"))
sub-hdr-peak=auto
dither-depth=auto
hdr-compute-peak=auto
video-output-levels=auto
image-subs-hdr-peak=1000

