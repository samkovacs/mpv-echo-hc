### Conditional Profiles ###

[HDR]
profile-desc=HDR
# NOTE: keyed on video-params (the DECODED source), which is stable.
# Do NOT re-key this on video-out-params to catch RTX Video HDR output:
# tested, and it oscillates. This profile sets d3d11-output-format and
# dither-depth, which force a VO reconfig, which momentarily nulls
# video-out-params, which un-fires the condition, which restores, which
# reconfigs again -- observed flapping pq/nil every ~1.5s in playback.
# RTX-HDR-converted SDR is handled from vsr_autocrop.lua instead, which
# knows deterministically when it turned true-HDR on.
profile-cond=(p["video-params/primaries"] == "bt.2020") and (p["video-params/gamma"] == "pq")
target-trc=pq
dither-depth=10
target-peak=603        # panel measures 603 nits peak, not 1000
sub-hdr-peak=203       # SDR reference white; 1000-nit subs on OLED are painful
# Separate option, separate default (1000). Governs PGS/VOBSUB bitmap subs,
# which is what Blu-ray remuxes actually carry -- sub-hdr-peak does NOT
# cover them. Left at 1000 it renders burned-in subs at ~1.7x this panel's
# full peak. "sdr" matches the text-sub setting above.
image-subs-hdr-peak=sdr
d3d11-output-csp=pq
target-prim=bt.2020
hdr-compute-peak=yes
target-contrast=inf    # min-luminance reads 0.0000 -- it's OLED
video-output-levels=full
target-colorspace-hint=yes
# rgb10_a2, NOT rgba16f. PQ (G2084) is not a valid DXGI colour space for an
# fp16 swapchain -- measured on this display:
#   rgba16f  + pq -> "RGB_FULL_G2084_NONE_P2020 ... normal: no,  overlay: no"
#   rgb10_a2 + pq -> "RGB_FULL_G2084_NONE_P2020 ... normal: yes, overlay: yes"
# With rgba16f mpv logs "Color space ... is not supported by this swapchain!"
# and falls back. rgb10_a2 is also what d3d11-output-format=auto picks.
# dither-depth=10 above matches this 10-bit swapchain exactly.
d3d11-output-format=rgb10_a2

