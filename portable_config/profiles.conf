[4k-Downscaling]
# (x or 0): height/width are nil between files and the condition is
# re-evaluated then -- logged "attempt to compare nil with number".
profile-cond=((height or 0) >= 2160 or (width or 0) >= 3840)
profile-restore=copy-equal
glsl-shaders-clr
glsl-shaders="~~/shaders/ssimsr.glsl;~~/shaders/ssimds.glsl"

linear-downscaling=no

# GAIN STAGING: the pan coefficients use "<", not "=".
#
# "<" makes ffmpeg renormalise the gains so they sum to 1; "=" takes them
# literally. With "=" the 5.1 coefficients sum to 2.414 and the 7.1 ones to
# 2.2, and volume=1.6 sat in front of that -- roughly +10 dB of gain on
# correlated material. Measured on a loud reel of Dune (TrueHD 7.1, source
# peak -0.02 dBFS), the old chain produced +4.93 dBFS before the limiter.
# It only ever sounded fine because alimiter was silently absorbing ~5 dB
# of gain reduction on every loud scene, with a 50 ms release -- i.e. the
# limiter was acting as the gain stage rather than as a safety net. Before
# alimiter was added at all, that content simply clipped.
#
# Make-up is +4 dB, chosen by measurement rather than taste. Pre-limiter
# peaks on two real films:
#
#   make-up   5.1 (93 Days)      7.1 (Dune)
#   current   -3.33 dBFS         +4.93 dBFS   <- clipping
#   +4 dB     -8.06 dBFS         -0.73 dBFS   <- limiter never engages
#   +6 dB     -6.06 dBFS         +1.27 dBFS   <- still clips
#
# +6 dB was the first guess and the measurement rejected it. This is
# around 5 dB quieter than the old chain; volume-max=200 covers taste, and
# the dynaudnorm line in mpv.conf covers wildly inconsistent mastering,
# which no fixed make-up can.
#
# volume-max is not repeated here -- mpv.conf already sets it to 200
# globally.
#
# SURROUNDS: 5.1 from AC3/DTS/TrueHD decodes as 5.1(side) -- SL/SR, not
# BL/BR -- and pan silently zeroes names absent from the input, so the old
# BL/BR-only formula dropped both surrounds on nearly every film. Both are
# named now; pan renormalises over whichever exist. Same for BC on 6.1.
# Front channels are ~3 dB lower in the mix than when the +4 dB make-up
# above was measured (surrounds now share the sum); not re-measured.
#
# DEVICE: gated on audio-channels=stereo (mpv.conf). audio-params is the
# SOURCE layout, so these used to fold to stereo even on a surround
# device. Surround device -> set audio-channels=auto-safe in mpv.conf.

[Downmix-Audio-5.1]
profile-cond=get("audio-channels") == "stereo" and (get("audio-params/channel-count") or 0) >= 5 and (get("audio-params/channel-count") or 0) < 7
profile-restore=copy-equal
af=lavfi="lowpass=c=LFE:f=120,pan=stereo|FL<0.5*FC+0.707*FL+0.707*SL+0.707*BL+0.5*LFE|FR<0.5*FC+0.707*FR+0.707*SR+0.707*BR+0.5*LFE,volume=4dB,alimiter=limit=0.97:attack=5:release=50"

[Downmix-Audio-7.1]
profile-cond=get("audio-channels") == "stereo" and (get("audio-params/channel-count") or 0) >= 7
profile-restore=copy-equal
af=lavfi="lowpass=c=LFE:f=120,pan=stereo|FL<0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.3*BC+0.5*LFE|FR<0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.3*BC+0.5*LFE,volume=4dB,alimiter=limit=0.97:attack=5:release=50"

