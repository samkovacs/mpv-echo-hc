# ArtCNN (Artoriuz, github.com/Artoriuz/ArtCNN): C4F16 is the only ArtCNN
# family that compiles on gpu-api=d3d11 -- C4F32 exceeds D3D11's 14 cbuffer
# slots, the _CMP compute builds exceed its 32 KB group shared memory, and
# libplacebo disables either after frame one. Sirosky's Ani4Kv2/AniSD
# fine-tunes only ship as C4F32/_CMP, so they cannot be used here.
[ArtCNN]
profile-desc=ArtCNN C4F16, clean anime (WEB-DL profile uses the DS variant automatically)
glsl-shaders="~~/shaders/ArtCNN_C4F16.glsl"

[ArtCNN-DS]
profile-desc=ArtCNN C4F16 denoise+sharpen, compressed web anime
glsl-shaders="~~/shaders/ArtCNN_C4F16_DS.glsl"

[Anime4K]
