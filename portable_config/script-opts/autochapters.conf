# requires curl (built into Windows 10/11 at System32\curl.exe) and
# guessit.exe. 1_Full_Latest_MPV_Installer.ps1 downloads guessit.exe into
# the install root alongside mpv.exe/yt-dlp.exe, where mpv's subprocess
# call finds it automatically -- no PATH registration needed.
# See https://github.com/po5/mpv-auto-chapters#installation
create_chapters=yes
on_file_load=yes
search_only_when_chapters_missing=yes
allow_loose_matches=yes
keep_previous_chapters=no
pause_on_search=yes
hook=no
