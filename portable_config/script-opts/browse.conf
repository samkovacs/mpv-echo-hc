# browse.lua result view: list (text rows) or grid (4x3 thumbnails).
# Tab toggles between them while a list is open.
view=list

# Grid thumbnails are cached in %TEMP%\mpv-browse-thumbs. Files older than
# this many days are deleted when mpv starts.
thumb_cache_days=7

# Twitch channels to check for live status (Open > Twitch > Live).
# Comma-separated channel logins (the name in the twitch.tv/<login> URL).
# Twitch does not let third-party clients read the account's follow list,
# so this is maintained by hand.
twitch_channels=theburntpeanut

# Torrents source (Open > Torrents). Paste your index's RSS URLs here; the
# submenu is hidden while both are empty. {query} in torrent_search_url is
# replaced with the URL-encoded search text, e.g.
#   torrent_search_url=https://index.example/?page=rss&q={query}&c=1_2
#   torrent_new_url=https://index.example/?page=rss&c=1_2
torrent_search_url=
torrent_new_url=

# Followed shows (Open > Torrents > Followed shows): comma-separated search
# strings, each with an optional |Group suffix to keep only that release
# group's uploads, e.g. torrent_shows=Sousou no Frieren|SubsPlease,Dandadan
torrent_shows=
