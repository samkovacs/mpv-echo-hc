# Requires the companion mpv-display-plugin (a compiled C plugin, not a
# Lua script) for display HDR capability info:
# https://github.com/dyphire/mpv-display-plugin -- installed as
# scripts/display-info.dll.
#
# noth: do nothing
# pass: pass HDR signal through when the monitor is already in HDR mode
# switch: auto-switch the display between HDR/SDR based on content
hdr_mode=pass
# only switch when fullscreen/maximized (only applies to hdr_mode=switch)
fullscreen_only=no
# target HDR display peak brightness; 0 = use mpv-display-plugin's
# detected value
target_peak=0
# measured display contrast used for HDR tone-mapping black point
# compensation; "auto" uses mpv-display-plugin's detected value, or set
# "inf" for OLED.
#
# Keep this on "auto". Hardcoding "inf" is only correct for the OLED --
# this machine also drives a 2560x1440 and a 1920x1080 panel, and
# infinite contrast on an LCD crushes shadow detail. "auto" resolves to
# "inf" anyway whenever the plugin reports a black level of 0, so the
# OLED still gets exactly the value that was hardcoded here, and the
# other two get their own.
target_contrast=auto

# FILENAME: this file MUST be named hdr_mode.conf, with an UNDERSCORE.
# mpv derives a script's options filename from the script name, and
# hdr-mode.lua registers as "hdr_mode". Named hdr-mode.conf (hyphen) it is
# never read -- mpv logs "script-opts/hdr_mode.conf not found." and every
# option here silently falls back to its built-in default, which for
# hdr_mode is "noth" (do nothing), leaving the whole script inert.
