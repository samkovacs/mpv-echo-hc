# enable automatic reload on timeout: when paused-for-cache fires, wait
# paused_for_cache_timer_timeout seconds then reload the video
paused_for_cache_timer_enabled=yes
# checking paused_for_cache property interval in seconds (min 0.05)
paused_for_cache_timer_interval=1
# time in seconds to wait until reload
paused_for_cache_timer_timeout=10

# enable automatic reload based on demuxer cache: if demuxer-cache-time
# hasn't changed within demuxer_cache_timer_timeout, reload once cache
# depletes
demuxer_cache_timer_enabled=yes
# checking demuxer-cache-time property interval in seconds (min 0.05)
demuxer_cache_timer_interval=2
# if demuxer cache received no data in this many seconds, treat it as
# stalled and reload when paused_for_cache happens
demuxer_cache_timer_timeout=20

# reload the stream at end-of-file to check for more content (live streams)
reload_eof_enabled=no

# keybinding to reload stream from current time position; set empty to disable
reload_key_binding=Ctrl+r
