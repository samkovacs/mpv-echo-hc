# Seconds after file-loaded before doing anything at all. Gives hwdec
# time to settle. This delay is intentional -- do not lower it just to
# make cropping feel snappier; that reintroduces evaluating VSR before
# hwdec is stable.
settle_delay=3

# Whether to auto-detect and crop black bars. VSR upscaling still works
# with this off, just without cropping first.
auto_crop=yes

# Black threshold for cropdetect. Smaller values generally crop less.
detect_limit=24/255
# The value which width/height should be divisible by. Smaller values
# have better detection accuracy.
detect_round=2
# The ratio of the minimum clip size to the original (0 to 1). If the
# picture is over-cropped, try raising this.
#
# Raising is safe; lowering toward 0 is not purely a taste change. It is a
# backstop against cropdetect's degenerate output as well as against
# over-cropping. There is now an explicit positive-dimension check in the
# script, so a negative rectangle can no longer slip through regardless of
# what this is set to, but the two still overlap.
detect_min_ratio=0.5
# How long (seconds) to gather cropdetect data after settle_delay.
detect_seconds=1

# If a detection pass yields nothing usable -- a degenerate rectangle from
# an all-black sample, no cropdetect data, or "no bars found" on a film
# that simply opens on a full-frame logo card -- detection is retried
# after 15s, 45s and 120s, stopping at the first usable result. Those are
# gaps between attempts, so the passes land around 4s / 20s / 65s / 185s.
# A file that detects correctly on the first pass never retries, and a
# retry that reaches the same conclusion as the previous pass leaves the
# filter chain untouched rather than rebuilding it.
#
# This exists because the single sample at settle_delay lands inside the
# studio logo or the fade-in from black on a large share of feature films,
# and cropdetect over an all-black window returns a degenerate rectangle
# (measured: -1918x-1078+1920+1080 on a 1920x1080 source). Before the
# retries that meant the whole film played letterboxed, silently, because
# suppress_osd hides the only diagnostic.
#
# The schedule itself lives in retry_delays in vsr_autocrop.lua.

# Whether to suppress the OSD message when crop/VSR are applied.
suppress_osd=yes

# Whether to also request NVIDIA RTX Video HDR (SDR->HDR enhancement) from
# the same d3d11vpp filter used for VSR upscaling. Requires mpv 0.40+, RTX
# Video HDR enabled in the NVIDIA app, and the companion mpv-display-plugin
# (see hdr_mode.conf) so this script can confirm the display is actually in
# HDR mode before applying it -- otherwise off by default and a no-op.
nvidia_true_hdr=no
